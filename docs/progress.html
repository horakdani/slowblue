          return n;
        }
        function phaseStatus(p) {
          var d = countDone(p);
          if (d === countLive(p)) return 'done';
          if (d > 0) return 'active';
          for (var i = 0; i < p.tasks.length; i++)
            if (p.tasks[i].status === 'active') return 'active';
          return 'todo';
        }

        var total = 0,
          done = 0,
          active = null;
        s.phases.forEach(function (p) {
          total += countLive(p);
          done += countDone(p);
        });
        for (var i = 0; i < s.phases.length; i++) {
          if (phaseStatus(s.phases[i]) !== 'done') {
            active = s.phases[i];
            break;
          }
        }
        var pct = total ? Math.round((done / total) * 100) : 0;

        var h = '';
        h +=
          '<header><h1>' +
          esc(s.title) +
          '</h1><p class="sub">' +
          esc(s.subtitle) +
          '</p>' +
          '<div class="meta"><span>ág <b>' +
          esc(s.branch) +
          '</b></span><span>frissítve <b>' +
          esc(s.updated) +
          '</b></span><span>most itt tartunk: <b>' +
          (active ? esc(active.id + '. ' + active.title) : 'kész') +
          '</b></span></div></header>';

        h +=
          '<div class="overall"><div class="nums"><span class="pct">' +
          pct +
          '%</span><span class="of">' +
          done +
          ' / ' +
          total +
          ' részfeladat, ' +
          s.phases.length +
          ' fázisban</span></div>' +
          '<div class="bar"><i style="width:' +
          pct +
          '%"></i></div></div>';

        h += '<h2 class="sec">Fázisok</h2>';
        s.phases.forEach(function (p) {
          // A soron következő fázis akkor is meg van jelölve, ha még egy
          // részfeladata sincs elkezdve - a fejléc rá mutat, tehát a listában is
          // látszania kell. Enélkül egy frissen kezdett fázis semmiben nem
          // különbözik a hátrébb lévőktől.
          var st = p === active ? 'active' : phaseStatus(p);
          var d = countDone(p);
          var live = countLive(p);
          var w = live ? Math.round((d / live) * 100) : 0;
          h +=
            '<section class="phase is-' +
            st +
            '"><div class="phead"><span class="pnum">' +
            p.id +
            '</span><h3 class="ptitle">' +
            esc(p.title) +
            '</h3><span class="pcount">' +
            d +
            '/' +
            live +
            '</span></div>';
          h += '<p class="pgoal">' + esc(p.goal) + '</p>';
          if (p.criteria && p.criteria.length) {
            h += '<div class="crit">';
            p.criteria.forEach(function (c) {
              h += '<span>' + c + '. kritérium</span>';
            });
            if (p.chunked)
              h += '<span>felvonásonként fut</span>';
            h += '</div>';
          }
          h +=
            '<div class="pbar bar small"><i style="width:' + w + '%"></i></div>';
          h += '<ul class="tasks">';
          p.tasks.forEach(function (t) {
            h +=
              '<li class="st-' +
              esc(t.status) +
              '"><span class="mark"></span><span class="tid">' +
              esc(t.id) +
              '</span><span><span class="tt">' +
              esc(t.title) +
              '</span>' +
              (t.commit
                ? '<span class="tcommit">' + esc(t.commit) + '</span>'
                : '') +
              (t.note ? '<span class="tn">' + esc(t.note) + '</span>' : '') +
              '</span></li>';
          });
          h += '</ul></section>';
        });

        if (s.audit && s.audit.length) {
          h += '<h2 class="sec">Kiindulási audit</h2><table class="audit">';
          s.audit.forEach(function (a) {
            var label =
              a.verdict === 'ok'
                ? 'megvan'
                : a.verdict === 'part'
                  ? 'részben'
                  : 'hiány';
            h +=
              '<tr><td class="v v-' +
              esc(a.verdict) +
              '">' +
              label +
              '</td><td class="c">' +
              esc(a.criterion) +
              '</td><td class="n">' +
              esc(a.note) +
              '</td></tr>';
          });
          h += '</table>';
        }

        if (s.frozen && s.frozen.length) {
          h += '<h2 class="sec">Befagyasztva — ehhez nem nyúlunk</h2><ul class="plain">';
          s.frozen.forEach(function (f) {
            h += '<li>' + esc(f) + '</li>';
          });
          h += '</ul>';
        }

        if (s.log && s.log.length) {
          h += '<h2 class="sec">Napló</h2><ul class="plain">';
          s.log
            .slice()
            .reverse()
            .forEach(function (l) {
              h +=
                '<li><span class="logdate">' +
                esc(l.date) +
                '</span>' +
                esc(l.text) +
                '</li>';
            });
          h += '</ul>';
        }

        h +=
          '<footer>Ezt a lapot a <code>/slowblue</code> parancs írja. Az állapot a fájl tetején lévő ' +
          '<code>slowblue-state</code> JSON blokkban van; kézi szerkesztésnél azt szerkeszd, ne a HTML-t.</footer>';

        document.getElementById('app').innerHTML = h;
      })();
    </script>
  </body>
</html>
